name: Deploy SalahCircle to GitHub Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install TypeScript compiler
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Type-check TypeScript source
        run: npm run typecheck
      - name: Build browser JavaScript
        run: npm run build
      - name: Validate JavaScript syntax
        run: node --check app.js
      - name: Check required PWA files
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s manifest.json
          test -s sw.js
          test -s icons/icon.svg
          node -e "const m=require('./manifest.json'); if (!m.name || !m.start_url || !m.icons?.length) process.exit(1)"
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: \${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
