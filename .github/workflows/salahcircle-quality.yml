name: SalahCircle quality checks

on:
  pull_request:
  push:
    branches: [main, "feat/**"]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-package-lock
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
